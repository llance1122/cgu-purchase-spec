<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>請購規範確認表產生器</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--fg:#1b1b1f;--muted:#6b6b76;--line:#e2e2e8;--soft:#f0f2f5;
  --accent:#1e5ea8;--accent-fg:#fff;--ok-bg:#dcf3e4;--ok-fg:#145c31;
  --warn-bg:#fdf1d6;--warn-fg:#7a5300;--err-bg:#fdecea;--err:#8c1d18;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#17171a;--card:#212127;--fg:#ececf1;--muted:#a0a0ad;--line:#35353d;--soft:#2a2a31;
  --accent:#5b9bd8;--accent-fg:#10233a;--ok-bg:#16351f;--ok-fg:#9fe0b6;
  --warn-bg:#4a3a11;--warn-fg:#f3d791;--err-bg:#3d1f1d;--err:#f3b0aa;}}
*{box-sizing:border-box}
body{margin:0;padding:22px 16px;background:var(--bg);color:var(--fg);
  font:15px/1.6 "Segoe UI","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:650}
#usage{margin-left:auto;font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:14px;margin:0 0 12px;font-weight:650}
label{display:block;font-size:12px;font-weight:650;margin:0 0 5px;color:var(--muted)}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--fg);font:inherit}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:640px){.grid,.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
button{padding:8px 15px;border:1px solid var(--line);border-radius:7px;background:var(--card);
  color:var(--fg);font:inherit;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.ghost{color:var(--muted)}
button.mini{padding:3px 8px;font-size:12px;line-height:1.4}
.status{font-size:13px;color:var(--muted);margin-top:10px;min-height:1.5em}
.status.err{color:var(--err)}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.hint a{color:var(--accent)}
.banner{background:var(--err-bg);color:var(--err);border-radius:8px;padding:12px;font-size:13px;margin-bottom:12px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:650;padding:6px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td textarea{min-height:38px;font-size:14px}
.no-cell{width:74px}
.no-cell input{text-align:center;font-weight:600}
.act{width:104px;white-space:nowrap}
.count{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.count.over{color:var(--err);font-weight:600}
tr.other td{background:var(--soft)}
.legend{font-size:12px;color:var(--muted);margin-top:10px}
.srcbox{margin-top:16px;padding:12px 14px;background:var(--soft);border-radius:9px}
.srchead{font-size:13px;font-weight:650;margin-bottom:6px}
#sources{margin:0;padding-left:22px;font-size:13px}
#sources li{margin:3px 0;word-break:break-all}
#sources a{color:var(--accent)}
#rawInfo{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--muted);
  max-height:280px;overflow:auto;margin:8px 0 0;padding:10px;background:var(--card);border-radius:7px}
footer{max-width:1000px;margin:26px auto 0;padding:14px 16px;border-top:1px solid var(--line);
  font-size:13px;color:var(--muted);text-align:center}
footer strong{color:var(--warn-fg);background:var(--warn-bg);padding:2px 8px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>請購規範確認表產生器</h1>
  <span id="usage"></span>
</header>

<div id="banner" class="banner" hidden></div>

<!-- 設定 -->
<details class="card" id="cfg">
  <summary style="cursor:pointer;font-weight:650;font-size:14px">
    設定 <span id="keyPill" class="pill warn">未設定金鑰</span>
  </summary>
  <div style="margin-top:12px">
    <label for="keySel">使用中的金鑰</label>
    <div class="row" style="margin-top:0">
      <select id="keySel" style="flex:1"></select>
      <button id="delKey" class="ghost">刪除這組</button>
    </div>

    <label for="keyName" style="margin-top:14px">新增一組金鑰</label>
    <div class="row" style="margin-top:0">
      <input id="keyName" placeholder="名稱，例如「個人」「系上」" style="flex:0 0 200px">
      <input id="key" type="password" placeholder="貼上金鑰" autocomplete="off" spellcheck="false" style="flex:1">
      <button id="eye" class="ghost">👁</button>
      <button id="saveKey" class="primary">加入</button>
    </div>
    <p class="hint">到 <a href="https://air.cgu.edu.tw/workspace4/LLMAPI/index.php" target="_blank" rel="noopener">AIR 平台</a> 取得。
      金鑰只存在這台電腦的瀏覽器，這個檔案沒有後端。</p>

    <label for="model" style="margin-top:12px">模型</label>
    <select id="model"></select>
  </div>
</details>

<!-- 輸入 -->
<div class="card">
  <h2>1. 基本資料</h2>
  <div class="grid3">
    <div><label for="specCode">規格代號</label><input id="specCode" placeholder="例如 0811"></div>
    <div><label for="matCode">材料編號</label><input id="matCode" placeholder="例如 M-123456"></div>
    <div><label for="date">建檔/列印日</label><input id="date"></div>
  </div>
  <label for="product" style="margin-top:12px">產品（貼網址，或直接輸入型號）</label>
  <input id="product" placeholder="https://…　或　HP Color LaserJet Pro 3303sdw">
  <div class="row">
    <button id="query" class="primary">查詢規格</button>
    <button id="stop" class="ghost" hidden>停止</button>
    <span style="flex:1"></span>
    <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin:0;font-size:13px;color:var(--fg)">
      <input type="checkbox" id="ict" style="width:auto"> 資通訊產品（加註教育部規定）
    </label>
  </div>
  <p id="st1" class="status"></p>
</div>

<!-- 結果 -->
<div class="card" id="result" hidden>
  <h2>2. 確認與修改</h2>
  <div class="grid">
    <div><label for="matName">材料規範名稱</label><input id="matName"></div>
    <div><label for="warranty">保固（列在「其他」，不進規格）</label><input id="warranty"></div>
  </div>

  <table style="margin-top:14px">
    <thead><tr>
      <th class="no-cell">項次</th><th style="width:26%">規格名稱</th><th>品質標準</th><th class="act">操作</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="row">
    <button id="addRow">＋ 新增一列</button>
    <button id="addOther" class="ghost">＋ 新增「其他」列</button>
    <span style="flex:1"></span>
    <span id="rowInfo" class="legend"></span>
  </div>
  <p class="legend">項次欄留空會自動編號；填「其他」則不參與編號。單格上限 100 字元，超過無法產生檔案。</p>

  <div id="sourceBox" class="srcbox" hidden>
    <div class="srchead">資料來源　<span class="legend">請點開核對規格是否正確</span></div>
    <ol id="sources"></ol>
    <details style="margin-top:8px">
      <summary style="cursor:pointer;font-size:12px;color:var(--muted)">查到的原始資料</summary>
      <pre id="rawInfo"></pre>
    </details>
  </div>

  <div class="row" style="margin-top:16px">
    <button id="gen" class="primary">產生 Word 檔</button>
    <span id="st2" class="status" style="margin:0"></span>
  </div>
</div>

<footer>
  本表內容由 AI 自動產生，可能有誤或過時，<strong>請務必自行核對規格正確性</strong>後再送出請購。
</footer>

</div>

const CRC = (() => { const t=new Int32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c;}return t;})();
function crc32(u8){let c=-1;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&0xFF]^(c>>>8);return (c^-1)>>>0;}

async function inflateRaw(u8){
  return new Uint8Array(await new Response(
    new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
}
async function deflateRaw(u8){
  return new Uint8Array(await new Response(
    new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
}

async function zipRead(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= 0 && i > buf.length - 66000; i--)
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('範本不是有效的 zip');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = [];
  for (let i = 0; i < count; i++) {
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const cmtLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(buf.slice(p + 46, p + 46 + nameLen));
    const lNameLen = dv.getUint16(localOff + 26, true);
    const lExtraLen = dv.getUint16(localOff + 28, true);
    const dataOff = localOff + 30 + lNameLen + lExtraLen;
    const raw = buf.slice(dataOff, dataOff + compSize);
    out.push({ name, data: method === 8 ? await inflateRaw(raw) : raw });
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}

async function zipWrite(entries){
  const locals = [], centrals = [];

  for (const e of entries) {
    const nameBuf = new TextEncoder().encode(e.name);
    const comp = await deflateRaw(e.data);

    const lh = new Uint8Array(30); const ldv = new DataView(lh.buffer);
    ldv.setUint32(0,0x04034b50,true); ldv.setUint16(4,20,true); ldv.setUint16(6,0x0800,true);

    locals.push(lh, nameBuf, comp);
    const ch = new Uint8Array(46); const cdv = new DataView(ch.buffer);
    cdv.setUint32(0,0x02014b50,true); cdv.setUint16(4,20,true); cdv.setUint16(6,20,true);
    cdv.setUint16(8,0x0800,true); cdv.setUint16(10,8,true); cdv.setUint16(14,0x21,true);
    cdv.setUint32(16,crc,true); cdv.setUint32(20,comp.length,true); cdv.setUint32(24,e.data.length,true);
    cdv.setUint16(28,nameBuf.length,true); cdv.setUint32(42,offset,true);
    centrals.push(ch, nameBuf);
    offset += 30 + nameBuf.length + comp.length;
  }
  const cSize = centrals.reduce((n,b)=>n+b.length,0);
  const eocd = new Uint8Array(22); const edv = new DataView(eocd.buffer);
  edv.setUint32(0,0x06054b50,true); edv.setUint16(8,entries.length,true);
  edv.setUint16(10,entries.length,true); edv.setUint32(12,cSize,true); edv.setUint32(16,offset,true);
  const all = [...locals, ...centrals, eocd];
  const total = all.reduce((n,b)=>n+b.length,0);
  const buf = new Uint8Array(total);
  let o = 0; for (const b of all) { buf.set(b, o); o += b.length; }
  return buf;
}

/* ================= docx ================= */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rid = () => Math.random().toString(16).slice(2,10).toUpperCase();

function mkRun(text,{bold=false}={}){
  return '<w:r><w:rPr><w:rFonts w:eastAsia="微軟正黑體"/>'+(bold?'<w:b/><w:bCs/>':'')+
    '<w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr>'+
    '<w:t xml:space="preserve">'+esc(text)+'</w:t></w:r>';
}
function setCell(tc,text,opts={}){
  const i = tc.indexOf('</w:tcPr>');
  const head = i>=0 ? tc.slice(0,i+9) : tc.slice(0, Math.max(0, tc.indexOf('<w:p')));
  return head + '<w:p w14:paraId="'+rid()+'" w14:textId="'+rid()+'">'+
    (opts.center?'<w:pPr><w:jc w:val="center"/></w:pPr>':'')+
    (text===''?'':mkRun(text,opts))+'</w:p>';
}
function splitCells(tr){const p=tr.split('<w:tc>');return [p[0],p.slice(1).map(x=>x.slice(0,x.lastIndexOf('</w:tc>')))];}
function joinCells(pre,cells){return pre+cells.map(c=>'<w:tc>'+c+'</w:tc>').join('');}
function splitRows(t){const p=t.split('<w:tr ');return {head:p[0],rows:p.slice(1).map(x=>{const i=x.indexOf('</w:tr>');return {inner:x.slice(0,i),tail:x.slice(i+7)};})};}
function joinRows(head,rs){return head+rs.map(r=>'<w:tr '+r.inner+'</w:tr>'+r.tail).join('');}

function validateXml(xml){
  const bad=[];
  for(const tag of ['w:tbl','w:tr','w:tc','w:p','w:r']){
    const open=(xml.match(new RegExp('<'+tag+'(?=[ >])(?:[^>]*[^/>])?>','g'))||[]).length;
    const close=(xml.match(new RegExp('</'+tag+'>','g'))||[]).length;
    if(open!==close) bad.push(tag+' 開 '+open+' 合 '+close);
  }
  if(bad.length) throw new Error('產生的 XML 標籤不對稱：'+bad.join('、'));
}

function decodeTemplate(){
  // 開到未經建置的原始檔時，這裡還是佔位符 —— 給出看得懂的訊息而不是 atob 的天書
  if (/^_+TEMPLATE_B64_+$/.test(TEMPLATE_B64)) {
    throw new Error('這是未建置的原始檔。請改開 output 資料夾裡的「請購規範產生器.html」' +
      '（若沒有，先執行 node build-web.js 產生）。');
  }
  const clean = TEMPLATE_B64.replace(/\s+/g, '');
  const bad = clean.match(/[^A-Za-z0-9+/=]/);
  if (bad) throw new Error('內嵌範本毀損：第 ' + clean.indexOf(bad[0]) + ' 個字元是「' + bad[0] + '」，請重新執行 node build-web.js。');
  return Uint8Array.from(atob(clean), c => c.charCodeAt(0));
}

async function buildDocx(header, list){
  const bin = decodeTemplate();
  const entries = await zipRead(bin);
  const doc = entries.find(e=>e.name==='word/document.xml');
  let xml = new TextDecoder().decode(doc.data);
  const tbls = xml.split('<w:tbl>');
  if (tbls.length < 4) throw new Error('範本結構不符預期');

  { const {head,rows:rs}=splitRows(tbls[1]);
    const fill=(r,c,t)=>{const [pre,cells]=splitCells(rs[r].inner);cells[c]=setCell(cells[c],t);rs[r].inner=joinCells(pre,cells);};
    fill(0,1,header.name); fill(0,3,header.specCode); fill(1,1,header.matCode); fill(2,3,header.date);
    tbls[1]=joinRows(head,rs); }

  { const {head,rows:rs}=splitRows(tbls[2]);
    const proto=rs[2];
    let n=0;
    const made=list.map(r=>{
      const [pre,cells]=splitCells(proto.inner);
      const label = r.no ? r.no : String(++n);
      cells[0]=setCell(cells[0],label,{bold:true,center:true});
      cells[1]=setCell(cells[1],r.name);
      cells[2]=setCell(cells[2],r.standard);
      return {inner:joinCells(pre,cells),tail:''};
    });
    made[made.length-1].tail = rs[rs.length-1].tail;   // 保住 </w:tbl>
    tbls[2]=joinRows(head,rs.slice(0,2).concat(made)); }

  xml = tbls.join('<w:tbl>');
  validateXml(xml);
  doc.data = new TextEncoder().encode(xml);
  return zipWrite(entries);
}

/* ================= API ================= */
function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+getKey()};}

function loadKeys(){
  try { keys = JSON.parse(localStorage.getItem(LS.keys) || '[]'); } catch { keys = []; }
  if (!Array.isArray(keys)) keys = [];
}
function saveKeys(){ localStorage.setItem(LS.keys, JSON.stringify(keys)); }
function activeIndex(){
  const i = parseInt(localStorage.getItem(LS.active) || '0', 10);
  return (i >= 0 && i < keys.length) ? i : 0;
}
function getKey(){ const k = keys[activeIndex()]; return k ? k.key : ''; }

function renderKeys(){
  const sel = $('keySel');
  sel.replaceChildren(...keys.map((k, i) => new Option(k.name || ('金鑰 ' + (i + 1)), String(i))));
  if (!keys.length) sel.replaceChildren(new Option('（尚未新增任何金鑰）', ''));
  sel.value = String(activeIndex());
  sel.disabled = !keys.length;
  $('delKey').disabled = !keys.length;
  keyPill();
}

async function callResponses(body){
  const res = await fetch(BASE+'/responses',{method:'POST',headers:headers(),
    body:JSON.stringify(body),signal:controller?.signal});
  const txt = await res.text();
  let j=null; try{j=JSON.parse(txt);}catch{}
  if(!res.ok){
    const hint={401:'金鑰無效。',403:'模型未授權或額度用完。',404:'模型不存在。',429:'呼叫太頻繁。'}[res.status]||'';
    throw new Error('HTTP '+res.status+'：'+hint+(j?.error?.message||txt.slice(0,150)));
  }
  const msgs = (j.output||[]).filter(o=>o.type==='message');
  const text = msgs.flatMap(o=>(o.content||[]).filter(c=>c.type==='output_text').map(c=>c.text)).join(String.fromCharCode(10)).trim();
  // web_search 會把引用的網址放在 annotations，抓出來讓使用者可以核對
  const cites = msgs.flatMap(o => (o.content||[]).flatMap(c => c.annotations || []))
    .filter(a => a && a.url)
    .map(a => ({ url: a.url, title: (a.title || a.url).slice(0, 120) }));
  return { text, cites };
}


const SCHEMA_PROMPT = `你要把產品規格整理成台灣大學採購用的「請購規範確認表」內容。

只輸出一個 JSON 物件，不要有其他文字，也不要 markdown 圍欄：

{
  "materialName": "中文通用品名，不含廠牌，例如「彩色雷射多功能事務機」",
  "isICT": true 或 false,
  "recommendedModel": "廠牌型號加中文品名",
  "warranty": "保固條件，查不到就填空字串",
  "rows": [ { "name": "規格名稱", "standard": "品質標準" } ],
  "sources": ["這些規格的來源網址，越具體越好"]
}

規則：
- name 與 standard 都不得超過 ${LIMIT} 個字元
- 不得使用列點、編號或破折號開頭，每格是一句完整敘述
- name 是規格項目（例如「處理器」「列印速度」），standard 照抄實際規格
- rows 只放產品本身的硬體與功能規格
- 不要把保固或推薦型號放進 rows，它們有各自的欄位
- 通常 5 到 12 項，涵蓋主要規格即可`;

async function doQuery(){
  if(!getKey()){ $('cfg').open=true; setSt('st1','請先在「設定」填入 API Key。',true); return; }
  const product = $('product').value.trim();
  if(!product){ setSt('st1','請輸入產品網址或型號。',true); return; }

  busy(true); controller = new AbortController();
  try{
    const isUrl = /^https?:\/\//i.test(product);
    setSt('st1', isUrl ? '請模型讀取該網址…' : '上網搜尋產品規格…');
    const r1 = await callResponses({
      model: $('model').value,
      instructions: '你是採購規格分析助理。查出使用者指定產品的品名、廠牌型號與官方規格。'+
        '以官方或原廠頁面為優先來源，不要編造頁面上沒有的數據。',
      input: isUrl ? '請讀取這個網址並整理出該產品的完整規格：'+product
                   : '請查詢這項產品的完整官方規格：'+product,
      tools:[{type:'web_search'}],
      max_output_tokens: 2000,
    });
    const info = r1.text;

    setSt('st1','整理成表格欄位…');
    const r2 = await callResponses({
      model: $('model').value, instructions: SCHEMA_PROMPT, input: info, max_output_tokens: 3000,
    });
    let raw = r2.text;
    const fence = raw.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/);
    if(fence) raw = fence[1].trim();
    let spec;
    try{ spec = JSON.parse(raw); }
    catch{ throw new Error('模型沒有回傳合法 JSON，請再試一次或換個模型。'); }

    $('matName').value = spec.materialName || product;
    $('warranty').value = spec.warranty || '';
    if(spec.isICT) $('ict').checked = true;

    rows = (spec.rows||[]).map(r=>({no:'',name:String(r.name||''),standard:String(r.standard||'')}));
    if(spec.recommendedModel) rows.push({no:'',name:'推薦型號',standard:'如 '+spec.recommendedModel});

    // 來源：web_search 實際引用的 + 模型自己列的，合併去重
    const fromModel = Array.isArray(spec.sources)
      ? spec.sources.filter(u=>typeof u==='string'&&/^https?:/.test(u)).map(u=>({url:u,title:u}))
      : [];
    const all = [...r1.cites, ...fromModel];
    if (isUrl) all.unshift({ url: product, title: '你提供的網址' });
    sources = [];
    for (const c of all) if (!sources.some(x=>x.url===c.url)) sources.push(c);
    renderSources(info);

    render();
    $('result').hidden = false;
    setSt('st1','查詢完成，請確認下方內容');
    loadUsage();
    $('result').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    if(e.name==='AbortError') setSt('st1','已停止');
    else { setSt('st1', explain(e), true); }
  }finally{ busy(false); controller=null; }
}

function explain(e){
  if(e instanceof TypeError){
    $('banner').hidden=false;
    $('banner').innerHTML='<strong>連線被擋下</strong><br>若你是雙擊開啟這個檔案，少數瀏覽器會封鎖本機網頁對外的請求。'+
      '解法：把檔案放到一個資料夾，在該資料夾執行 <code>python -m http.server 8000</code>，'+
      '再開 <code>http://localhost:8000/</code>。';
    return '無法連線到 API，見上方說明。';
  }
  return e.message;
}

/* ================= 表格編輯 ================= */
function render(){
  const tb = $('rows');
  tb.replaceChildren();
  let n = 0;
  rows.forEach((r,i)=>{
    const isOther = !!r.no;
    if(!isOther) n++;
    const tr = document.createElement('tr');
    if(isOther) tr.className='other';

    const tdNo = document.createElement('td'); tdNo.className='no-cell';
    const inNo = document.createElement('input');
    inNo.value = r.no; inNo.placeholder = String(n);
    inNo.oninput = e => { rows[i].no = e.target.value.trim(); render(); };
    tdNo.append(inNo);

    const mk = (field, ph) => {
      const td = document.createElement('td');
      const ta = document.createElement('textarea');
      ta.rows = 2; ta.value = r[field]; ta.placeholder = ph;
      const cnt = document.createElement('div'); cnt.className='count';
      const upd = () => { const L=ta.value.length; cnt.textContent=L+' / '+LIMIT;
        cnt.className='count'+(L>LIMIT?' over':''); };
      ta.oninput = e => { rows[i][field] = e.target.value; upd(); info(); };
      upd();
      td.append(ta,cnt);
      return td;
    };

    const tdAct = document.createElement('td'); tdAct.className='act';
    const b = (t,fn,cls)=>{const x=document.createElement('button');x.className='mini '+(cls||'ghost');x.textContent=t;x.onclick=fn;return x;};
    tdAct.append(
      b('↑',()=>{ if(i>0){[rows[i-1],rows[i]]=[rows[i],rows[i-1]];render();} }),
      b('↓',()=>{ if(i<rows.length-1){[rows[i+1],rows[i]]=[rows[i],rows[i+1]];render();} }),
      b('✕',()=>{ rows.splice(i,1); render(); })
    );

    tr.append(tdNo, mk('name','規格名稱'), mk('standard','品質標準'), tdAct);
    tb.append(tr);
  });
  info();
}

function renderSources(rawText){
  const ol = $('sources');
  ol.replaceChildren(...sources.map(c => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = c.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = c.title || c.url;
    li.append(a);
    if (c.title && c.title !== c.url) {
      const sm = document.createElement('div');
      sm.className = 'legend'; sm.style.margin = '0';
      sm.textContent = c.url;
      li.append(sm);
    }
    return li;
  }));
  if (!sources.length) {
    const li = document.createElement('li');
    li.textContent = '這次查詢沒有取得可引用的網址，請自行搜尋核對。';
    ol.append(li);
  }
  $('rawInfo').textContent = rawText || '';
  $('sourceBox').hidden = false;
}

function info(){
  const over = rows.filter(r=>r.name.length>LIMIT||r.standard.length>LIMIT).length;
  const el = $('rowInfo');
  el.textContent = '共 '+rows.length+' 列'+(over?'　⚠ '+over+' 列超過字數':'');
  el.style.color = over ? 'var(--err)' : 'var(--muted)';
  $('gen').disabled = over>0 || rows.length===0;
}

/* ================= 產生檔案 ================= */
async function generate(){
  const list = rows.map(r=>({no:r.no,name:r.name.trim(),standard:r.standard.trim()}));
  const w = $('warranty').value.trim();
  if(w) list.push({no:'',name:'保固',standard:w});
  if($('ict').checked) list.push({no:'',name:'其他',standard:ICT_NOTE});

  const bad = list.filter(r=>r.name.length>LIMIT||r.standard.length>LIMIT);
  if(bad.length){ setSt('st2','有 '+bad.length+' 格超過 '+LIMIT+' 字元。',true); return; }

  setSt('st2','產生中…');
  try{
    const header = {
      name: $('matName').value.trim(),
      specCode: $('specCode').value.trim(),
      matCode: $('matCode').value.trim(),
      date: $('date').value.trim(),
    };
    const buf = await buildDocx(header, list);
    const safe = (header.name||'請購規範').replace(/[\\/:*?"<>|]/g,'_').slice(0,40);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf],
      {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}));
    a.download = '請購規範_'+safe+'_'+$('date').value.replace(/\//g,'')+'.docx';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    setSt('st2','✅ 已產生並下載');
  }catch(e){ setSt('st2','產生失敗：'+e.message,true); }
}

/* ================= 其他 ================= */
function setSt(id,msg,err){const el=$(id);el.textContent=msg;el.className='status'+(err?' err':'');}
function busy(on){$('query').disabled=on;$('stop').hidden=!on;}
function keyPill(){
  const k = keys[activeIndex()];
  const p = $('keyPill');
  p.textContent = k ? ('使用中：' + (k.name || '未命名')) : '未設定金鑰';
  p.className = 'pill ' + (k ? 'ok' : 'warn');
}
function fillModels(list){const s=$('model');const want=localStorage.getItem(LS.model)||FALLBACK[0];
  s.replaceChildren(...list.map(m=>new Option(m,m)));s.value=list.includes(want)?want:list[0];}

async function loadUsage(){
  try{
    const r = await fetch(BASE+'/me/usage',{headers:headers()});
    if(!r.ok) return;
    const u = await r.json(); const o = u.openai||{};
    if(typeof o.remaining_usd==='number')
      $('usage').textContent='餘額 $'+o.remaining_usd.toFixed(2)+(typeof o.quota_usd==='number'?' / $'+o.quota_usd:'');
  }catch{}
}
async function loadModels(){
  try{
    const r = await fetch(BASE+'/models',{headers:headers()});
    if(!r.ok) return;
    const ids=(await r.json()).data.map(x=>x.id)
      .filter(i=>/^gpt/.test(i)&&!/image|tts|transcribe|whisper|realtime|embedding/.test(i)).sort();
    if(ids.length) fillModels(ids);
  }catch{}
}

/* ---- 啟動 ---- */
(function init(){
  const d=new Date();
  $('date').value = d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
  loadKeys(); renderKeys();
  fillModels(FALLBACK);

  $('keySel').onchange = e => {
    localStorage.setItem(LS.active, e.target.value);
    keyPill(); $('usage').textContent=''; loadModels(); loadUsage();
  };
  $('saveKey').onclick = () => {
    const k = ($('key').value||'').trim();
    if(!k){ alert('請先貼上金鑰。'); return; }
    const name = ($('keyName').value||'').trim() || ('金鑰 ' + (keys.length + 1));
    keys.push({ name, key: k });
    saveKeys();
    localStorage.setItem(LS.active, String(keys.length - 1));
    localStorage.setItem(LS.model, $('model').value);
    $('key').value=''; $('keyName').value='';
    renderKeys(); loadModels(); loadUsage();
  };
  $('delKey').onclick = () => {
    if(!keys.length) return;
    const i = activeIndex();
    if(!confirm('刪除「' + (keys[i].name||'未命名') + '」？')) return;
    keys.splice(i,1); saveKeys();
    localStorage.setItem(LS.active, '0');
    renderKeys(); $('usage').textContent=''; if(getKey()){loadModels();loadUsage();}
  };
  $('eye').onclick=()=>{const e=$('key');e.type=e.type==='password'?'text':'password';};
  $('query').onclick=doQuery;
  $('stop').onclick=()=>controller&&controller.abort();
  $('gen').onclick=generate;
  $('addRow').onclick=()=>{rows.push({no:'',name:'',standard:''});render();};
  $('addOther').onclick=()=>{rows.push({no:'',name:'其他',standard:''});render();};
  $('product').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doQuery();}});

  if(getKey()){ loadModels(); loadUsage(); } else { $('cfg').open=true; }

  // 一載入就檢查範本，開錯檔案時立刻告知，而不是填完資料才失敗
  try { decodeTemplate(); }
  catch(e){
    $('banner').hidden = false;
    $('banner').innerHTML = '<strong>開錯檔案了</strong><br>' + e.message;
    $('query').disabled = true;
  }
})();
</script>
